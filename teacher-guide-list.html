<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Guide | Genius English Academy</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f8f8f8;
  color:#222;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

.guide-page{
  max-width:1200px;
  margin:0 auto;
  padding:42px 20px 60px;
}

.guide-title{
  text-align:center;
  margin-bottom:30px;
}

.guide-title h1{
  margin:0 0 7px;
  font-size:30px;
  font-weight:700;
}

.guide-title p{
  margin:0;
  font-size:13px;
  color:#777;
}

.search-box{
  max-width:680px;
  margin:0 auto 28px;
}

.search-box input{
  width:100%;
  height:50px;
  border:1px solid #d4d4d4;
  border-radius:5px;
  background:#fff;
  padding:0 18px;
  font-size:14px;
  outline:none;
}

.search-box input:focus{
  border-color:#777;
}

.ar-tabs{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:35px;
}

.ar-tab{
  border:1px solid #d0d0d0;
  background:#fff;
  color:#555;
  padding:9px 20px;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
}

.ar-tab.active{
  background:#222;
  border-color:#222;
  color:#fff;
}

.result-info{
  display:none;
  background:#fff;
  border:1px solid #ddd;
  padding:11px 14px;
  margin-bottom:22px;
  border-radius:4px;
  font-size:13px;
}

.level-section{
  margin-bottom:42px;
}

.level-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid #222;
  padding-bottom:9px;
  margin-bottom:18px;
}

.level-title h2{
  margin:0;
  font-size:20px;
}

.book-count{
  color:#888;
  font-size:12px;
}

.book-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
}

.book-card{
  background:#fff;
  border:1px solid #e0e0e0;
  border-radius:5px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.book-card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 16px rgba(0,0,0,.08);
}

.cover{
  aspect-ratio:3/4;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.book-info{
  padding:10px;
}

.book-title{
  font-size:13px;
  font-weight:700;
  line-height:1.35;
  min-height:35px;
  margin-bottom:6px;
}

.book-meta{
  color:#777;
  font-size:10px;
  line-height:1.7;
}

.no-result{
  display:none;
  text-align:center;
  padding:70px 20px;
  background:#fff;
  border:1px solid #ddd;
  color:#888;
}

@media(max-width:1050px){
  .book-grid{grid-template-columns:repeat(5,1fr)}
}

@media(max-width:850px){
  .book-grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:600px){
  .guide-page{padding:30px 15px 45px}
  .book-grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .ar-tab{padding:8px 14px}
}

@media(max-width:430px){
  .book-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="header-wrap">
      <a href="./index_new.html" class="logo-slider">
        <img src="./images/logo1.png" class="logo-slide show">
        <img src="./images/logo2.png" class="logo-slide">
      </a>
    </div>
  </div>

  <div class="header-menu">
    <div class="header-wrap">
      <nav class="main-menu">
        <a href="./academy.html">학원소개</a>
        <a href="./curriculum.html">커리큘럼</a>

        <div class="dropdown">
          <a href="#">학습자료</a>
          <div class="dropdown-menu">
            <a href="./reading.html">📚 원서 음원 듣기</a>
            <a href="./vocabulary.html">🎧 매일 단어 듣기</a>
          </div>
        </div>

        <a href="https://global-zone60.renaissance-go.com/welcomeportal/rpna83al" target="_blank">
          <span class="pc-text">르네상스 러닝</span>
          <span class="mobile-text">르네상스</span>
        </a>

        <a href="./notice.html">공지사항</a>
        <a href="./contact.html">상담문의</a>
      </nav>
    </div>
  </div>
</header>

<main class="guide-page">

  <div class="guide-title">
    <h1>Teacher Guide</h1>
    <p>Book Talk &amp; 3-Sentence Summary Writing</p>
  </div>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="책 제목 또는 AR Quiz Number를 검색하세요"
      autocomplete="off"
    >
  </div>

  <div class="ar-tabs">
    <button class="ar-tab active" data-level="all">전체</button>
    <button class="ar-tab" data-level="0">AR 0점대</button>
    <button class="ar-tab" data-level="1">AR 1점대</button>
    <button class="ar-tab" data-level="2">AR 2점대</button>
    <button class="ar-tab" data-level="3">AR 3점대</button>
  </div>

  <div id="resultInfo" class="result-info"></div>
  <div id="bookList"></div>

  <div id="noResult" class="no-result">
    검색 결과가 없습니다.
  </div>

</main>

<footer class="bg-red-600 text-white text-center py-8">
  <a href="teacher-guide-list.html" class="hover:opacity-80">
    © 2026 Genius English Academy
  </a>
</footer>

<script src="./assets/js/books.js"></script>
<script src="./assets/js/teacher-guide.js"></script>

<script>
let currentLevel="all";

const searchInput=document.getElementById("searchInput");
const bookList=document.getElementById("bookList");
const noResult=document.getElementById("noResult");
const resultInfo=document.getElementById("resultInfo");

function cleanPath(path){
  if(!path) return "";
  return path.replace(/^(\.\.\/)+/,"");
}

function arLevel(book){
  const n=parseFloat(book.ar);
  return isNaN(n) ? null : Math.floor(n);
}

function createCard(book){
  const card=document.createElement("div");
  card.className="book-card";

  card.onclick=()=>{
    location.href="teacher-guide.html?id="+encodeURIComponent(book.id);
  };

  const cover=document.createElement("div");
  cover.className="cover";

  const img=document.createElement("img");
  img.src=cleanPath(book.image);
  img.alt=book.title;

  img.onerror=()=>{
    cover.innerHTML='<span style="font-size:11px;color:#999">No Cover</span>';
  };

  cover.appendChild(img);

  const info=document.createElement("div");
  info.className="book-info";

  info.innerHTML=`
    <div class="book-title">${book.title}</div>
    <div class="book-meta">
      AR ${book.ar}<br>
      Quiz ${book.quiz}
    </div>
  `;

  card.appendChild(cover);
  card.appendChild(info);

  return card;
}

function getFilteredBooks(){
  const keyword=searchInput.value.trim().toLowerCase();

  return books.filter(book=>{

    if(currentLevel!=="all" &&
       arLevel(book)!==Number(currentLevel)){
      return false;
    }

    if(keyword){
      const title=String(book.title||"").toLowerCase();
      const quiz=String(book.quiz||"").toLowerCase();

      if(!title.includes(keyword) && !quiz.includes(keyword)){
        return false;
      }
    }

    return true;
  });
}

function makeSection(title,list){
  const section=document.createElement("section");
  section.className="level-section";

  const heading=document.createElement("div");
  heading.className="level-title";

  heading.innerHTML=`
    <h2>${title}</h2>
    <span class="book-count">${list.length}권</span>
  `;

  const grid=document.createElement("div");
  grid.className="book-grid";

  list.forEach(book=>{
    grid.appendChild(createCard(book));
  });

  section.appendChild(heading);
  section.appendChild(grid);

  return section;
}

function render(){

  const keyword=searchInput.value.trim();
  const filtered=getFilteredBooks();

  bookList.innerHTML="";

  if(keyword){
    resultInfo.style.display="block";
    resultInfo.textContent=`검색 결과: "${keyword}" — ${filtered.length}권`;
  }else{
    resultInfo.style.display="none";
  }

  if(!filtered.length){
    noResult.style.display="block";
    return;
  }

  noResult.style.display="none";

  if(keyword){
    bookList.appendChild(makeSection("검색 결과",filtered));
    return;
  }

  if(currentLevel==="all"){
    [0,1,2,3].forEach(level=>{
      const list=filtered.filter(book=>arLevel(book)===level);

      if(list.length){
        bookList.appendChild(
          makeSection(`AR ${level}점대`,list)
        );
      }
    });
  }else{
    bookList.appendChild(
      makeSection(`AR ${currentLevel}점대`,filtered)
    );
  }
}

document.querySelectorAll(".ar-tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".ar-tab")
      .forEach(t=>t.classList.remove("active"));

    tab.classList.add("active");
    currentLevel=tab.dataset.level;
    render();
  });
});

searchInput.addEventListener("input",render);

render();
</script>

<script src="./assets/js/script.js"></script>

</body>
</html>
