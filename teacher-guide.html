<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Guide | Genius English Academy</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./assets/css/style.css">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

body{
  min-height:100vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
}

.guide-page{
  flex:1;
  min-height:0;
  padding:18px 22px;
}

.guide{
  max-width:1400px;
  height:100%;
  margin:0 auto;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:16px;
}

.book-panel,
.guide-panel{
  background:#fff;
  border:1px solid #ccc;
}

.book-panel{
  padding:18px;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.book-cover{
  width:100%;
  max-height:350px;
  object-fit:contain;
  margin:0 auto 15px;
}

.book-title{
  font-size:22px;
  font-weight:700;
  line-height:1.2;
  margin-bottom:4px;
}

.book-author{
  color:#777;
  font-size:12px;
  margin-bottom:16px;
}

.book-info{
  border-top:1px solid #ddd;
}

.about-book{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid #ddd;
}

.about-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

#aboutBook{
  font-size:11.5px;
  line-height:1.6;
  color:#444;
  white-space:pre-line;
}

.info-row{
  display:grid;
  grid-template-columns:75px 1fr;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #e5e5e5;
  font-size:11px;
  line-height:1.3;
}

.info-label{
  font-weight:700;
  color:#666;
}

.guide-panel{
  padding:18px 20px;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.guide-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;
  border-bottom:2px solid #222;
  padding-bottom:10px;
  margin-bottom:12px;
}

.guide-heading .small{
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  color:#777;
}

.guide-heading h1{
  margin:0;
  font-size:26px;
}

.sections{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1.25fr;
  gap:12px;
}

.section{
  border:1px solid #d2d2d2;
  padding:12px 14px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.section-title{
  font-size:13px;
  font-weight:800;
  border-bottom:1px solid #222;
  padding-bottom:6px;
  margin-bottom:9px;
}

.summary{
  font-size:12px;
  line-height:1.5;
  background:#f3f3f3;
  border-left:3px solid #333;
  padding:10px 11px;
}

.vocab{
  width:100%;
  border-collapse:collapse;
  font-size:10.5px;
}

.vocab th,
.vocab td{
  border-bottom:1px solid #ddd;
  padding:4px 5px;
  text-align:left;
}

.vocab th{
  background:#f1f1f1;
}

.qa{
  margin-bottom:7px;
  font-size:10.5px;
  line-height:1.35;
}

.question{
  font-weight:700;
}

.answer{
  padding-left:10px;
  color:#444;
}

.writing{
  display:grid;
  grid-template-columns:48px 1fr;
  border-bottom:1px solid #ddd;
  padding:6px 0;
  font-size:10.5px;
  line-height:1.35;
}

.writing-label{
  font-size:9px;
  font-weight:800;
  color:#666;
}

.notice{
  color:#777;
  font-size:11px;
  line-height:1.5;
  background:#f5f5f5;
  padding:12px;
  border-left:3px solid #999;
}

@media(max-width:850px){
  body{overflow:auto}

  .guide-page{
    height:auto;
    min-height:0;
    padding:16px;
  }

  .guide{
    height:auto;
    grid-template-columns:1fr;
  }

  .book-panel{
    align-items:center;
  }

  .book-cover{
    max-width:260px;
    max-height:none;
  }

  .sections{
    grid-template-columns:1fr;
    grid-template-rows:auto;
  }

  .section{
    overflow:visible;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="header-wrap">
      <a href="./index.html" class="logo-slider">
        <img src="./images/logo1.png" class="logo-slide show">
        <img src="./images/logo2.png" class="logo-slide">
      </a>
    </div>
  </div>

  <div class="header-menu">
    <div class="header-wrap">
      <nav class="main-menu">
        <a href="./academy.html">학원소개</a>
        <a href="./curriculum.html">커리큘럼</a>

        <div class="dropdown">
          <a href="#">학습자료</a>
          <div class="dropdown-menu">
            <a href="./reading.html">📚 원서 음원 듣기</a>
            <a href="./vocabulary.html">🎧 매일 단어 듣기</a>
          </div>
        </div>

        <a href="https://global-zone60.renaissance-go.com/welcomeportal/rpna83al" target="_blank">
          <span class="pc-text">르네상스 러닝</span>
          <span class="mobile-text">르네상스</span>
        </a>

        <a href="./notice.html">공지사항</a>
        <a href="./contact.html">상담문의</a>
      </nav>
    </div>
  </div>
</header>

<main class="guide-page">

  <div class="guide">

    <aside class="book-panel">

      <img id="bookCover" class="book-cover" src="" alt="Book Cover">

      <div id="bookTitle" class="book-title"></div>
      <div id="bookAuthor" class="book-author"></div>

      <div id="bookInfo" class="book-info"></div>

      <div class="about-book">
  <div class="about-title">About this Book</div>
  <div id="aboutBook"></div>
</div>

    </aside>


    <section class="guide-panel">

      <div class="guide-heading">
        <div class="small">TEACHER GUIDE</div>
        <h1 id="guideTitle"></h1>
      </div>


      <div class="sections">

        <!-- 1 -->
        <section class="section">

          <div class="section-title">
            1. Quick Summary
          </div>

          <div id="summary" class="summary"></div>

        </section>


        <!-- 2 -->
        <section class="section">

          <div class="section-title">
            2. Key Vocabulary
          </div>

          <table class="vocab">

            <thead>
              <tr>
                <th>English</th>
                <th>Korean</th>
              </tr>
            </thead>

            <tbody id="vocabulary"></tbody>

          </table>

        </section>


        <!-- 3 -->
        <section class="section">

          <div class="section-title">
            3. Book Talk Questions &amp; Answers
          </div>

          <div id="questions"></div>

        </section>


        <!-- 4 -->
        <section class="section">

          <div class="section-title">
            4. 3-Sentence Summary Writing
          </div>

          <div id="writing"></div>

        </section>

      </div>

    </section>

  </div>

</main>


<footer class="bg-red-600 text-white text-center py-8">
  <a href="teacher-guide-list.html" class="hover:opacity-80">
    © 2026 Genius English Academy
  </a>
</footer>


<script src="./assets/js/books.js"></script>
<script src="./assets/js/teacher-guide.js"></script>

<script>

function cleanPath(path){
  if(!path) return "";
  return path.replace(/^(\.\.\/)+/,"");
}

const params=new URLSearchParams(location.search);
const id=params.get("id") || "thegokart";

const book=books.find(b=>b.id===id);

const guide=teacherGuides[id];


if(!book){

  document.getElementById("guideTitle").textContent="Book Not Found";

  document.getElementById("bookTitle").textContent="Book Not Found";

  document.getElementById("summary").innerHTML=
    '<div class="notice">해당 책 정보를 찾을 수 없습니다.</div>';

}else{

  document.title=
    `${book.title} | Teacher Guide | Genius English Academy`;

  document.getElementById("bookCover").src=
    cleanPath(book.image);

  document.getElementById("bookCover").alt=
    book.title;

  document.getElementById("bookTitle").textContent=
    book.title;

  document.getElementById("bookAuthor").textContent=
    book.author || "";

  document.getElementById("guideTitle").textContent=
    book.title;


  document.getElementById("bookInfo").innerHTML=`

    <div class="info-row">
      <div class="info-label">Series</div>
      <div>${book.series || "-"}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Category</div>
      <div>${book.category || "-"}</div>
    </div>

    <div class="info-row">
      <div class="info-label">AR Level</div>
      <div>${book.ar || "-"}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Quiz No.</div>
      <div>${book.quiz || "-"}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Word Count</div>
      <div>${book.wordCount || "-"}</div>
    </div>
  `;
document.getElementById("aboutBook").textContent =
  book.summary || "";

  if(!guide){

    document.getElementById("summary").innerHTML=
      '<div class="notice">이 책의 Teacher Guide는 아직 준비 중입니다.</div>';

    document.getElementById("vocabulary").innerHTML=
      '<tr><td colspan="2" style="color:#999">준비 중</td></tr>';

    document.getElementById("questions").innerHTML=
      '<div class="notice">Book Talk Questions & Answers 준비 중</div>';

    document.getElementById("writing").innerHTML=
      '<div class="notice">3-Sentence Summary Writing 준비 중</div>';

  }else{

    document.getElementById("summary").textContent=
      guide.summary || "";

    document.getElementById("vocabulary").innerHTML=
      (guide.vocabulary || []).map(item=>`
        <tr>
          <td><strong>${item[0]}</strong></td>
          <td>${item[1]}</td>
        </tr>
      `).join("");


    document.getElementById("questions").innerHTML=
      (guide.questions || []).map((item,index)=>`
        <div class="qa">
          <div class="question">
            Q${index+1}. ${item[0]}
          </div>
          <div class="answer">
            A. ${item[1]}
          </div>
        </div>
      `).join("");


    document.getElementById("writing").innerHTML=
      (guide.writing || []).map((sentence,index)=>`
        <div class="writing">
          <div class="writing-label">
            Sentence ${index+1}
          </div>
          <p style="margin:0">
            ${sentence}
          </p>
        </div>
      `).join("");

  }
}

</script>

<script src="./assets/js/script.js"></script>

</body>
</html>
